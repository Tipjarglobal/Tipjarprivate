# TipJar — Hetzner Deployment (4GB RAM optimiert, kein OOM)
# Speicher-Budget:  mongo 1G  +  backend 2G  +  frontend 0.5G  = 3.5G  (0.5G Puffer)
#
# Start:   cp .env.hetzner.example .env  &&  nano .env  &&  docker compose up -d --build
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    mem_limit: 1g
    mem_reservation: 512m
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - DB_NAME=${DB_NAME:-tipjar}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - EMERGENT_LLM_KEY=${EMERGENT_LLM_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy
    mem_limit: 2g
    mem_reservation: 1g
    expose:
      - "8001"

  frontend:
    build:
      context: ./frontend
      args:
        # Gleiche Origin wie die Domain -> nginx proxyt /api zum Backend
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-http://localhost}
    restart: unless-stopped
    depends_on:
      - backend
    mem_limit: 512m
    ports:
      - "80:80"

volumes:
  mongo_data:
