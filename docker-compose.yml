services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    ports:
      - "27017:27017"

  backend:
    build: ./backend
    depends_on:
      - mongo
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "8001:8001"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    mem_limit: 512m
    ports:
      - "80:80"
    restart: unless-stopped

  scraper:
    build: ./scraper
    depends_on:
      - mongo
    env_file:
      - ./backend/.env
    restart: unless-stopped

volumes:
  mongo_data:
  mongo_config:
