<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>confidential menu</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;600;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Geist',system-ui,sans-serif}
body{background:#070707;color:#e8e8e8;padding-bottom:60px}
.hdr{position:sticky;top:0;z-index:10;background:#070707;border:1px solid #39ff14;border-radius:14px;margin:14px;padding:16px 18px;box-shadow:0 0 24px rgba(57,255,20,.15)}
h1{color:#39ff14;font-weight:800;font-size:26px;letter-spacing:-.5px}
.sub{color:#8a8a8a;font-size:12px;margin-top:4px}
.langs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.langs button{background:#141414;color:#8a8a8a;border:1px solid #222;border-radius:999px;padding:6px 12px;font-size:11px;font-weight:800;cursor:pointer;transition:.15s}
.langs button.on{background:#39ff14;color:#000;border-color:#39ff14}
.sec{color:#666;font-size:11px;font-weight:800;letter-spacing:2px;margin:22px 16px 8px}
.card{background:#141414;border:1px solid #222;border-radius:14px;margin:12px 16px;padding:16px}
.card.money{border-color:#e3a81b}
.card h3{font-size:15px;font-weight:800;color:#39ff14;margin-bottom:6px}
.card.money h3{color:#e3a81b}
.desc{color:#b5b5b5;font-size:12.5px;line-height:1.6;margin-bottom:10px}
.greek{color:#7fd0ff;font-size:12px;line-height:1.6;margin-top:8px;border-left:2px solid #7fd0ff;padding-left:10px}
.row{border-left:3px solid #39ff14;background:#0d0d0d;border-radius:8px;padding:9px 12px;margin-top:7px;font-family:ui-monospace,monospace;font-size:12.5px;color:#dcdcdc}
.card.money .row{border-left-color:#e3a81b}
.tab-link{display:block;text-align:center;color:#39ff14;font-weight:800;font-size:13px;margin:20px 16px;padding:12px;border:1px dashed #39ff14;border-radius:12px;text-decoration:none}
</style>
</head>
<body>
<div class="hdr">
  <h1>confidential menu</h1>
  <div class="sub" id="sub"></div>
  <div class="langs" id="langs"></div>
</div>
<div class="sec" id="secTitle"></div>
<div id="list"></div>
<a class="tab-link" href="tracker.html" id="trackerLink">→ Tracker</a>

<script>
const LANGS=["DE","EN","TR","EL","FR","NL","PT","SQ"];
const UI={
 DE:{sub:"sichere extra legs – alle bleiben drin, rot/grün/void später",glitches:"GLITCHES",extras:"EXTRA",tracker:"→ Zum Tracker"},
 EN:{sub:"safe extra legs – all stay in, red/green/void later",glitches:"GLITCHES",extras:"EXTRA",tracker:"→ Open tracker"},
 TR:{sub:"güvenli ekstra bacaklar – hepsi kalır, kırmızı/yeşil/void sonra",glitches:"GLITCHES",extras:"EKSTRA",tracker:"→ Tracker'ı aç"},
 EL:{sub:"ασφαλή extra legs – όλα μένουν, κόκκινο/πράσινο/void αργότερα",glitches:"GLITCHES",extras:"EXTRA",tracker:"→ Άνοιγμα tracker"},
 FR:{sub:"legs supplémentaires sûrs – tout reste, rouge/vert/void plus tard",glitches:"GLITCHES",extras:"EXTRA",tracker:"→ Ouvrir le tracker"},
 NL:{sub:"veilige extra legs – alles blijft, rood/groen/void later",glitches:"GLITCHES",extras:"EXTRA",tracker:"→ Tracker openen"},
 PT:{sub:"legs extra seguros – tudo fica, vermelho/verde/void depois",glitches:"GLITCHES",extras:"EXTRA",tracker:"→ Abrir tracker"},
 SQ:{sub:"legs shtesë të sigurta – të gjitha qëndrojnë, kuq/gjelbër/void më vonë",glitches:"GLITCHES",extras:"EXTRA",tracker:"→ Hap tracker"}
};
function tt(o){return (o&&(o[LANG]||o.EN||o.DE))||"";}
const GLITCHES=[
 {t:{DE:"1. Team trifft immer – Über 0.5 Team",EN:"1. Team always scores – Over 0.5 team"},
  d:{DE:"Antwerp, AEK, Fenerbahçe treffen in ~95% der Spiele. Bookie gibt trotzdem 1.10–1.30. Perfekt zum Kombi pushen.",
     EN:"Antwerp, AEK, Fenerbahçe score in ~95% of games. Bookie still offers 1.10–1.30. Perfect to push accumulators."},
  rows:["✔ Kortrijk 0:3 Antwerpen – Über 0.5 Antwerpen @1.30 GEWONNEN","✔ Fenerbahçe 2:1 – Über 0.5 Fener @1.10 GEWONNEN","✔ AEK 2:2 – Über 0.5 @1.14 GEWONNEN"]},
 {t:{DE:"2. Thun Glitch – Quali reguläre Zeit",EN:"2. Thun glitch – qualification regular time"},
  d:{DE:"Hinspiel hoch gewonnen (Thun 3:0) → Rückspiel muss nicht gewonnen werden. Winning Method = reguläre Zeit = Quali nach 90 Min, keine Verlängerung. Bookie preist ET ein, die nie passiert = 1.05–1.06 geschenkt.",
     EN:"Big first-leg win (Thun 3:0) → 2nd leg need not be won. Winning method = regular time = qualification after 90 min, no extra time. Bookie prices in ET that never happens = 1.05–1.06 for free."},
  rows:["✔ Vikingur 3:2 Thun (Hin 0:3) – Thun reguläre Zeit @1.06 GEWONNEN","✔ Sturm 0:1 Fenerbahçe (Hin 0:2) – Fener reguläre Zeit @1.05 GEWONNEN"]},
 {t:{DE:"3. Porto Glitch – Unter 5.5 absurd",EN:"3. Porto glitch – Under 5.5 absurd"},
  d:{DE:"Konfigurator: Über 0.5 + Unter 5.5 + X2. Porto schießt auswärts gegen Rio Ave nie 6 Tore. Free boost von 1.10 auf 1.23 ohne Risiko.",
     EN:"Builder: Over 0.5 + Under 5.5 + X2. Porto never scores 6 away at Rio Ave. Free boost from 1.10 to 1.23 with no risk."},
  rows:["✔ Rio Ave 0:2 Porto – Über 0.5 + Unter 5.5 + X2 @1.23 GEWONNEN"]},
 {t:{DE:"4. Shots Glitch – Rückstand = mehr Schüsse",EN:"4. Shots glitch – trailing = more shots"},
  d:{DE:"K.O.-Phase 2. Spiel. Team liegt zurück (Sabah 1:2 vs Aarhus) und MUSS gewinnen → wirft alles nach vorne = mehr Schüsse, auch bei Niederlage. Hinspiel hatte Sabah mehr Schüsse trotz Rückstand.",
     EN:"K.O. 2nd leg. Team trailing (Sabah 1:2 vs Aarhus) and MUST win → throws everything forward = more shots, even if losing. First leg Sabah had more shots despite trailing."},
  rows:["✔ Sabah 4:0 AGF Aarhus (Hin 1:2) – Total Shots Sabah @1.41 GEWONNEN"]},
 {money:true,t:{DE:"5. Money Glitch – PAOK + Zafeiris",EN:"5. Money glitch – PAOK + Zafeiris"},
  d:{DE:"Konfigurator: Total Über 0.5 + Spieler-Schüsse Über 0.5. PAOK zuhause vs Anderlecht muss (Hin 1:0) = torreich + Mittelfeldspieler Zafeiris schießt mind. 1×. Bookie gibt 1.33 für 2 sichere Linien.",
     EN:"Builder: Total Over 0.5 + player shots Over 0.5. PAOK home vs Anderlecht must attack (1st 1:0) = goals + midfielder Zafeiris takes ≥1 shot. Bookie gives 1.33 for 2 safe lines."},
  rows:["💰 Anderlecht 3:2 PAOK (Hin 1:0) – Über 0.5 + Zafeiris Über 0.5 Schüsse @1.33 GEWONNEN"]},
 {money:true,t:{DE:"6. Money Glitch – Almeria -1 Asian Handicap",EN:"6. Money glitch – Almeria -1 Asian Handicap"},
  d:{DE:"Almeria massiv verstärkt, behält Topscorer Arribas, Vorbereitung 2-0 & 4-0 Siege. Eldense als Aufsteiger 5 Niederlagen, Qualitätsgap Heim. Asian -1 safe: Einsatz zurück bei 1 Tor, voll bei 2+.",
     EN:"Almeria massively reinforced, kept top scorer Arribas, pre-season 2-0 & 4-0 wins. Eldense as promoted side 5 defeats, quality gap at home. Asian -1 safe: stake back on 1 goal, full on 2+."},
  greek:"Η Αλμερία ενισχύθηκε σημαντικά, διατήρησε τον περσινό πρώτο σκόρερ Αρίμπας, με νίκες προετοιμασίας 2-0 και 4-0. Η Ελδένσε ως νεοφώτιστη με 5 ήττες. Ασιατικό -1 ασφαλές: επιστροφή στο 1 γκολ, πλήρες στα 2+.",
  rows:["💰 Almeria -1 AH + Über 1.5 @2.13"]}
];
const EXTRAS=[
 {t:{DE:"Palermo +0,5 (Doppelte Chance / Asian)",EN:"Palermo +0.5 (double chance / Asian)"},
  d:{DE:"Palermo auf Serie-A-Niveau, Heimvorteil & Enthusiasmus. Gegner Letse mit 2 Ausfällen. +0,5 Absicherung.",
     EN:"Palermo at Serie A level, home advantage & enthusiasm. Opponent Lecce with 2 absences. +0.5 cover."},
  greek:"Η Παλέρμο διαθέτει ένα ποιοτικό ρόστερ επιπέδου Serie A, με πλεονέκτημα έδρας και ενθουσιασμό. Ο αντίπαλος έχει 2 απουσίες. +0,5 για κάλυψη.",
  rows:["✔ Palermo +0,5 @1.80"]}
];
let LANG=localStorage.getItem("cg_lang")||"DE";
function render(){
 const u=UI[LANG];
 document.documentElement.lang=LANG.toLowerCase();
 document.getElementById("sub").textContent=u.sub;
 document.getElementById("trackerLink").textContent=u.tracker;
 document.getElementById("langs").innerHTML=LANGS.map(l=>`<button class="${l===LANG?'on':''}" onclick="setLang('${l}')">${l}</button>`).join("");
 const card=(g)=>`<div class="card ${g.money?'money':''}"><h3>${tt(g.t)}</h3><div class="desc">${tt(g.d)}</div>${g.greek&&LANG!=='EL'?`<div class="greek">${g.greek}</div>`:''}${g.rows.map(r=>`<div class="row">${r}</div>`).join("")}</div>`;
 document.getElementById("secTitle").textContent=u.glitches;
 let html=GLITCHES.map(card).join("");
 html+=`<div class="sec">${u.extras}</div>`+EXTRAS.map(card).join("");
 document.getElementById("list").innerHTML=html;
}
function setLang(l){LANG=l;localStorage.setItem("cg_lang",l);render();}
render();
</script>
</body>
</html>
