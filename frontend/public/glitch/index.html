*{margin:0;padding:0;box-sizing:border-box;font-family:"Geist",system-ui}
body{background:#070707;color:#e5e5e5;min-height:100vh;padding:20px}
.wrap{max-width:1000px;margin:0 auto}
.header{border:2px solid #39ff14;border-radius:16px;padding:20px;background:#111;position:sticky;top:10px;z-index:10}
.header h1{color:#39ff14;font-size:28px;font-weight:900;letter-spacing:-2px;text-transform:lowercase}

.card.gold h2{color:#ffd700}
.card p{font-size:12px;color:#999;line-height:1.5;margin:6px 0}
.pick{background:#0a0a0a;border-left:3px solid #39ff14;padding:8px 10px;border-radius:0 8px 8px 0;font-family:"Geist Mono",monospace;font-size:11px;margin-top:6px}
.pick.gold{border-color:#ffd700}
.quote{font-size:11px;color:#aaa;font-style:italic;background:#1a1a0a;padding:8px;border-radius:8px;margin-top:6px;line-height:1.4}
.section{margin-top:24px;padding-top:12px;border-top:1px dashed #222}
.section h3{font-size:12px;color:#555;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
</style>

   <div class="card gold"><h2>${t.g6t}</h2><p>${t.g6d}</p>${t.g6p.map(e=>`<div class="pick gold">💰 ${e}</div>`).join("")}${t.g6q?`<div class="quote">${t.g6q}</div>`:''}</div>
  </div>
  <div class="section"><h3>extras (rechte tab) - tipjar visuell</h3>
   <div class="card"><h2>${t.ex1t}</h2><p>${t.ex1d}</p>${t.ex1p.map(e=>`<div class="pick">✔ ${e}</div>`).join("")}<div class="quote">${t.ex1q}</div></div>
  </div>
 `;
 document.querySelectorAll(".langs button").forEach(b=>b.classList.toggle("active",b.dataset.l===cur));
}
const langsDiv=document.getElementById("langs");
Object.keys(data).forEach(l=>{ const b=document.createElement("button"); b.innerText=l; b.dataset.l=l; b.onclick=()=>{cur=l; render();}; langsDiv.appendChild(b); });
render();
